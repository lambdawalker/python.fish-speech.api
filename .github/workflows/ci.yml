name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - name: Verify installed wheel without dependencies
        run: |
          uv venv /tmp/fishapi-wheel
          uv pip install --python /tmp/fishapi-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/fishapi-wheel/bin/python -c "from fishapi import FishAPI; assert FishAPI('spark.local').base_url == 'http://spark.local:8080'"
