name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Validate source versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: uv run --locked python scripts/check_release.py
      - name: Build sdist and wheel from that sdist
        run: |
          rm -rf dist
          uv build
      - run: uv run --locked twine check --strict dist/*
      - name: Inspect artifacts and record provenance
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          mkdir -p release-record
          uv run --locked python scripts/check_release.py --dist dist --record release-record/release.json --sha "$(git rev-parse HEAD)"
      - name: Verify installed wheel without dependencies
        run: |
          uv venv "$RUNNER_TEMP/fishapi-wheel"
          uv pip install --python "$RUNNER_TEMP/fishapi-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fishapi-wheel/bin/python" -I -c "from fishapi import FishAPI; assert FishAPI('spark.local').base_url == 'http://spark.local:8080'"
      - name: Refuse existing PyPI versions before upload
        if: inputs.release-tag != '' && matrix.python == '3.12'
        run: uv run --no-project python scripts/verify_pypi.py release-record/release.json --preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: release-record
          path: release-record/release.json
          if-no-files-found: error
          retention-days: 90
