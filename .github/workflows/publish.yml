name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python scripts/check_release.py
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fish-speech-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: uv publish --trusted-publishing always dist/*
