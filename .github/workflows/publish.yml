name: Release and publish Python package

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Serialize automatic, manual, and release-event entry points.
concurrency:
  group: fish-speech-api-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release PR or create merged release
    if: github.repository == 'lambdawalker/python.fish-speech.api' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  source:
    name: Resolve immutable candidate or release source
    needs: release
    if: >-
      always() && !cancelled() &&
      github.repository == 'lambdawalker/python.fish-speech.api' &&
      (needs.release.result == 'success' ||
       (needs.release.result == 'skipped' && github.event_name == 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha || fromJSON(needs.release.outputs.pr || '{}').headBranchName || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source and validate release provenance
        id: source
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          source_sha=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$PRERELEASE" != 'true' ]]
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$source_sha" ]]
            git merge-base --is-ancestor "$source_sha" origin/main
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Validate exact source
    needs: source
    if: always() && !cancelled() && needs.source.result == 'success'
    uses: ./.github/workflows/ci.yml
    with:
      source-ref: ${{ needs.source.outputs.sha }}
      release-tag: ${{ needs.source.outputs.tag }}

  publish:
    name: Publish to PyPI
    needs: [release, source, build]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      needs.source.result == 'success' && needs.source.outputs.tag != '' &&
      github.repository == 'lambdawalker/python.fish-speech.api' &&
      (needs.release.outputs.created == 'true' || github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fish-speech-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish validated distributions using OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  verify:
    name: Confirm public files and clean installation
    needs: [source, publish]
    if: always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.19'
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-record
          path: release-record/
      - run: uv run --no-project python scripts/verify_pypi.py release-record/release.json
      - name: Install exact version from PyPI outside the checkout
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          uv venv "$RUNNER_TEMP/pypi-check"
          uv pip install --python "$RUNNER_TEMP/pypi-check/bin/python" --no-deps --index-url https://pypi.org/simple "fish-speech-api==${RELEASE_TAG#v}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-check/bin/python" -I -c "from fishapi import FishAPI; assert FishAPI('spark.local').base_url == 'http://spark.local:8080'"
