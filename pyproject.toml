[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fish-speech-api"
version = "0.1.0"
description = "Lightweight Python client for the self-hosted Fish Speech API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Garcia"}]
keywords = ["fish-speech", "tts", "speech", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
codec = ["ormsgpack>=1.7,<2"]

[dependency-groups]
dev = ["ormsgpack>=1.7,<2", "twine>=6,<7", "tomli>=2,<3; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.fish-speech.api"
Documentation = "https://github.com/lambdawalker/python.fish-speech.api/blob/main/docs/api.md"
Issues = "https://github.com/lambdawalker/python.fish-speech.api/issues"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/fishapi"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "docs", "scripts", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
